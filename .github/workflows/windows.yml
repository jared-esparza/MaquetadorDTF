name: Pruebas · Windows y web IONOS
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      release_required: ${{ steps.policy.outputs.release_required }}
      version: ${{ steps.policy.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Validar versión de la entrega
        id: policy
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/release-policy.mjs
      - name: Reutilizar artefactos ya comprobados al reintentar
        id: reuse
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          available=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.expired == false) | .name] | (index("web-dist") != null and index("windows-dist") != null)')
          echo "available=$available" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v7
        if: steps.reuse.outputs.available != 'true'
        with:
          python-version: '3.13'
      - run: npm ci
        if: steps.reuse.outputs.available != 'true'
      - run: python -m pip install -r requirements-test.txt
        if: steps.reuse.outputs.available != 'true'
      - run: npm run build
        if: steps.reuse.outputs.available != 'true'
      - run: npm test
        if: steps.reuse.outputs.available != 'true'
      - run: npx playwright test
        if: steps.reuse.outputs.available != 'true'
      - run: python scripts/verify-png.py
        if: steps.reuse.outputs.available != 'true'
      - run: python scripts/verify-pdf.py
        if: steps.reuse.outputs.available != 'true'
      - run: npx playwright test -c playwright.desktop.config.ts
        if: steps.reuse.outputs.available != 'true'
      - run: npm run dist:win:built
        if: steps.reuse.outputs.available != 'true'
      - name: Probar ejecutable empaquetado
        if: steps.reuse.outputs.available != 'true'
        shell: pwsh
        run: |
          $env:DTF_ELECTRON_EXE=(Resolve-Path 'release/win-unpacked/MaquetadorDTF.exe').Path
          npx playwright test -c playwright.desktop.config.ts
      - name: Verificar PDF y PNG exportados por el paquete
        if: steps.reuse.outputs.available != 'true'
        run: |
          python scripts/verify-pdf.py
          python scripts/verify-png.py
      - name: Preparar paquete web
        if: steps.reuse.outputs.available != 'true'
        run: npm run web:package
      - uses: actions/upload-artifact@v7
        if: steps.reuse.outputs.available != 'true'
        with:
          name: web-dist
          overwrite: true
          path: artifacts/web-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        if: steps.reuse.outputs.available != 'true'
        with:
          name: windows-dist
          overwrite: true
          path: |
            release/MaquetadorDTF-Setup-*.exe
            release/MaquetadorDTF-Portable-*.exe
            release/SHA256SUMS.txt
            docs/USO-WINDOWS.md
            build/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always() && steps.reuse.outputs.available != 'true'
        with:
          name: windows-test-results
          overwrite: true
          path: |
            artifacts/qa/
            test-results/
            desktop-test-results/
          retention-days: 14

  deploy-web:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: windows
    permissions:
      contents: write
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ionos-web-production
      cancel-in-progress: false
    environment:
      name: web-production
      url: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist
      - name: Comprobar configuración
        id: target
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
        run: |
          test -n "$WEB_URL" && test -n "$SFTP_HOST" && test -n "$SFTP_USER" && test -n "$SFTP_PASSWORD" && test -n "$SFTP_PORT" || { echo 'Falta configurar WEB_URL o los secretos SFTP.'; exit 1; }
          test -f web-dist/.htaccess
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Se omite este commit porque main ya tiene otro más reciente.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v8
        if: steps.target.outputs.current == 'true' && needs.windows.outputs.release_required == 'true'
        with:
          name: windows-dist
          path: distribution
      - name: Publicar Release preliminar del mismo commit
        if: steps.target.outputs.current == 'true' && needs.windows.outputs.release_required == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.windows.outputs.version }}
        run: node scripts/publish-release.mjs distribution
      - name: Publicar configuración de caché
        if: steps.target.outputs.current == 'true'
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          local_path: './web-dist/.htaccess'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false
      - name: Publicar editor en IONOS
        if: steps.target.outputs.current == 'true'
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          local_path: './web-dist/*'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false
      - name: Verificar web publicada y recursos
        if: steps.target.outputs.current == 'true'
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: node scripts/verify-deployment.mjs
