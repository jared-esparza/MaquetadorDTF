name: Pruebas · Windows y web IONOS
on:
  push:
    branches: [main, feat/electron-desktop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: npm ci
      - run: python -m pip install -r requirements-test.txt
      - run: npm run build
      - run: npm test
      - run: npm run test:e2e
      - run: python scripts/verify-pdf.py
      - run: npm run test:desktop
      - run: npm run dist:win
      - name: Probar ejecutable empaquetado
        shell: pwsh
        run: |
          $env:DTF_ELECTRON_EXE=(Resolve-Path 'release/win-unpacked/MaquetadorDTF.exe').Path
          npx playwright test -c playwright.desktop.config.ts
      - name: Verificar PDF exportado por el paquete
        run: python scripts/verify-pdf.py
      - name: Preparar paquete web
        run: npm run web:package
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: artifacts/web-dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: windows-dist
          path: |
            release/MaquetadorDTF-Setup-*.exe
            release/MaquetadorDTF-Portable-*.exe
            release/SHA256SUMS.txt
            docs/USO-WINDOWS.md
            build/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-test-results
          path: |
            artifacts/qa/
            test-results/
            desktop-test-results/
          retention-days: 14

  deploy-web:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: ionos-web-production
      cancel-in-progress: false
    environment:
      name: web-production
      url: ${{ vars.WEB_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist
      - name: Comprobar configuración
        id: target
        env:
          WEB_URL: ${{ vars.WEB_URL }}
          SFTP_HOST: ${{ secrets.IONOS_SFTP_HOST }}
          SFTP_USER: ${{ secrets.IONOS_SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.IONOS_SFTP_PASSWORD }}
          SFTP_PORT: ${{ secrets.IONOS_SFTP_PORT }}
        run: |
          test -n "$WEB_URL" && test -n "$SFTP_HOST" && test -n "$SFTP_USER" && test -n "$SFTP_PASSWORD" && test -n "$SFTP_PORT" || { echo 'Falta configurar WEB_URL o los secretos SFTP.'; exit 1; }
          test -f web-dist/.htaccess
          latest=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$latest" = "$GITHUB_SHA" ]; then
            echo 'current=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Se omite este commit porque main ya tiene otro más reciente.'
            echo 'current=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Publicar configuración de caché
        if: steps.target.outputs.current == 'true'
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          local_path: './web-dist/.htaccess'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false
      - name: Publicar editor en IONOS
        if: steps.target.outputs.current == 'true'
        uses: wlixcc/SFTP-Deploy-Action@a5ccb9c6211a94cc59404f0fdb2a9936a6dfee64 # v1.2.6
        with:
          server: ${{ secrets.IONOS_SFTP_HOST }}
          username: ${{ secrets.IONOS_SFTP_USER }}
          password: ${{ secrets.IONOS_SFTP_PASSWORD }}
          port: ${{ secrets.IONOS_SFTP_PORT }}
          local_path: './web-dist/*'
          remote_path: '/'
          sftp_only: true
          delete_remote_files: false
      - name: Verificar web publicada y recursos
        if: steps.target.outputs.current == 'true'
        env:
          WEB_URL: ${{ vars.WEB_URL }}
        run: node scripts/verify-deployment.mjs

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: windows-dist
          path: distribution
      - name: Preparar Release en borrador
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true || { echo 'No se sobrescribe una versión publicada.'; exit 1; }
          else
            gh release create "$TAG" --draft --title "Maquetador DTF $TAG" --notes-file docs/RELEASE.md
          fi
          mapfile -d '' assets < <(find distribution -type f \( -name '*.exe' -o -name 'SHA256SUMS.txt' -o -name 'USO-WINDOWS.md' -o -name 'THIRD_PARTY_NOTICES.txt' \) -print0)
          test "${#assets[@]}" -eq 5 || { echo 'Faltan archivos de distribución.'; exit 1; }
          gh release upload "$TAG" "${assets[@]}" --clobber
